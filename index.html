<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#06090e">
  <meta name="description" content="PLASSX HUMAN ONE is a mission to send humanity’s messages, memories, and stories into space—a message from Earth to future generations.">
  <title>PLASSX HUMAN ONE</title>
  <link rel="icon" type="image/png" href="favicon.png">
  <style>
    :root {
      color-scheme: dark;
      --white: #f5f4f1;
      --gold: #c9b38e;
    }

    * { box-sizing: border-box; }
    html, body { width: 100%; min-height: 100%; margin: 0; }
    body {
      min-height: 100vh;
      min-height: 100svh;
      overflow: hidden;
      background: #06090e;
      color: var(--white);
      font-family: "Avenir Next", Avenir, "Segoe UI", sans-serif;
    }
    .launch-page {
      position: relative;
      display: grid;
      min-height: 100vh;
      min-height: 100svh;
      place-items: center;
      overflow: hidden;
      isolation: isolate;
      padding: 120px 7vw 72px;
    }
    .hero-image {
      position: absolute;
      z-index: -2;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center 48%;
    }
    .brand {
      position: absolute;
      top: clamp(24px, 4vh, 42px);
      left: clamp(22px, 5vw, 76px);
      display: inline-flex;
      align-items: center;
    }
    .brand img { display: block; width: clamp(116px, 10vw, 156px); height: auto; }
    @media (max-width: 600px) {
      .launch-page { padding: 100px 24px 60px; }
      .hero-image { object-fit: contain; object-position: center; }
      .brand img { width: 104px; }
    }
    @media (prefers-reduced-motion: reduce) { html { scroll-behavior: auto; } }
  </style>
</head>
<body>
  <main class="launch-page">
    <img class="hero-image" src="hero01.png" alt="Satellite above Earth's horizon with the HUMAN ONE message for the future">
    <a class="brand" href="../index.html" aria-label="PLASSX HUMAN ONE">
      <img src="logo.png" alt="PLASSX">
    </a>
  </main>
</body>
</html>
